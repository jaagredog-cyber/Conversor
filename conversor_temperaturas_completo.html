<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Aplicación para convertir temperaturas entre Celsius, Fahrenheit y Kelvin." />
  <title>Conversor de Temperaturas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --pink: #ec4899;
      --white: #ffffff;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-950: #020617;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
      color: var(--white);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(34, 211, 238, 0.30), transparent 34%),
        radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.25), transparent 35%),
        linear-gradient(135deg, #020617, #172554, #4a044e);
    }

    .app {
      width: min(780px, 100%);
      animation: aparecer 0.65s ease both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      margin-bottom: 28px;
      text-align: center;
    }

    .icono {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 22px;
      font-size: 38px;
      background: linear-gradient(135deg, var(--cyan), var(--violet), var(--pink));
      box-shadow: 0 18px 40px rgba(139, 92, 246, 0.35);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -1.5px;
    }

    h1 span {
      color: #67e8f9;
    }

    header p {
      margin-top: 10px;
      color: var(--slate-300);
      line-height: 1.6;
    }

    .tarjeta {
      padding: clamp(20px, 5vw, 34px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--slate-200);
      font-size: 0.88rem;
      font-weight: 750;
    }

    .campo-temperatura {
      position: relative;
    }

    .campo-temperatura input {
      width: 100%;
      height: 70px;
      padding: 0 82px 0 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      outline: none;
      color: white;
      background: rgba(2, 6, 23, 0.68);
      font-size: 1.65rem;
      font-weight: 850;
      transition: 0.2s ease;
    }

    .campo-temperatura input:focus,
    select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12);
    }

    .simbolo-entrada {
      position: absolute;
      top: 50%;
      right: 22px;
      transform: translateY(-50%);
      color: #67e8f9;
      font-size: 1.3rem;
      font-weight: 850;
    }

    .conversion {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 16px;
      margin-top: 22px;
    }

    select {
      width: 100%;
      height: 55px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      outline: none;
      color: white;
      background: #0f172a;
      font-weight: 750;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .boton-intercambiar {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 16px;
      color: white;
      background: linear-gradient(135deg, #06b6d4, #7c3aed);
      box-shadow: 0 12px 27px rgba(6, 182, 212, 0.22);
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .boton-intercambiar:hover {
      transform: scale(1.08) rotate(180deg);
    }

    .resultado {
      margin-top: 25px;
      padding: 27px 18px;
      border: 1px solid rgba(232, 121, 249, 0.25);
      border-radius: 20px;
      text-align: center;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.23), rgba(219, 39, 119, 0.18));
    }

    .resultado h2 {
      color: #f0abfc;
      font-size: 0.76rem;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .valor-resultado {
      margin-top: 9px;
      overflow-wrap: anywhere;
      font-size: clamp(2.2rem, 8vw, 3.7rem);
      font-weight: 900;
    }

    .descripcion {
      margin-top: 8px;
      color: var(--slate-300);
      font-size: 0.9rem;
    }

    .mensaje-error {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 13px;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.14);
      text-align: center;
    }

    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .boton {
      min-height: 48px;
      padding: 11px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .boton-copiar {
      border: none;
      color: #0f172a;
      background: white;
    }

    .boton-restablecer {
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: white;
      background: rgba(255, 255, 255, 0.08);
    }

    .boton:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .equivalencias {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-top: 18px;
    }

    .equivalencia {
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
      transition: 0.2s ease;
    }

    .equivalencia:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .equivalencia small {
      display: block;
      margin-bottom: 7px;
      color: var(--slate-400);
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .equivalencia strong {
      font-size: 1.25rem;
    }

    .celsius { color: #67e8f9; }
    .fahrenheit { color: #fdba74; }
    .kelvin { color: #c4b5fd; }

    footer {
      margin-top: 20px;
      color: var(--slate-400);
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 650px) {
      body { display: block; }
      .conversion { grid-template-columns: 1fr; }
      .boton-intercambiar { margin: auto; transform: rotate(90deg); }
      .boton-intercambiar:hover { transform: rotate(270deg) scale(1.08); }
      .acciones, .equivalencias { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="icono" aria-hidden="true">🌡️</div>
      <h1>Conversor de <span>temperaturas</span></h1>
      <p>Convierte entre Celsius, Fahrenheit y Kelvin al instante.</p>
    </header>

    <section class="tarjeta" aria-label="Conversor de temperaturas">
      <label for="temperatura">Temperatura inicial</label>
      <div class="campo-temperatura">
        <input id="temperatura" type="number" value="25" step="any" placeholder="Ingresa un valor" />
        <span id="simboloEntrada" class="simbolo-entrada">°C</span>
      </div>

      <div class="conversion">
        <div>
          <label for="unidadOrigen">Convertir de</label>
          <select id="unidadOrigen">
            <option value="celsius">Celsius (°C)</option>
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>

        <button id="intercambiar" class="boton-intercambiar" type="button" title="Intercambiar unidades" aria-label="Intercambiar unidades">⇄</button>

        <div>
          <label for="unidadDestino">Convertir a</label>
          <select id="unidadDestino">
            <option value="fahrenheit">Fahrenheit (°F)</option>
            <option value="celsius">Celsius (°C)</option>
            <option value="kelvin">Kelvin (K)</option>
          </select>
        </div>
      </div>

      <div class="resultado">
        <h2>Resultado</h2>
        <div id="resultado" class="valor-resultado" aria-live="polite">77 °F</div>
        <p id="descripcion" class="descripcion">25 °C equivalen a 77 °F</p>
      </div>

      <div id="mensajeError" class="mensaje-error" role="alert">
        La temperatura ingresada está por debajo del cero absoluto.
      </div>

      <div class="acciones">
        <button id="copiar" class="boton boton-copiar" type="button">Copiar resultado</button>
        <button id="restablecer" class="boton boton-restablecer" type="button">Restablecer</button>
      </div>
    </section>

    <section class="equivalencias" aria-label="Equivalencias">
      <article class="equivalencia">
        <small>Celsius</small>
        <strong id="equivalenciaCelsius" class="celsius">25 °C</strong>
      </article>
      <article class="equivalencia">
        <small>Fahrenheit</small>
        <strong id="equivalenciaFahrenheit" class="fahrenheit">77 °F</strong>
      </article>
      <article class="equivalencia">
        <small>Kelvin</small>
        <strong id="equivalenciaKelvin" class="kelvin">298,15 K</strong>
      </article>
    </section>

    <footer>Compatible con valores negativos y decimales.</footer>
  </main>

  <script>
    const temperatura = document.getElementById("temperatura");
    const unidadOrigen = document.getElementById("unidadOrigen");
    const unidadDestino = document.getElementById("unidadDestino");
    const resultado = document.getElementById("resultado");
    const descripcion = document.getElementById("descripcion");
    const mensajeError = document.getElementById("mensajeError");
    const simboloEntrada = document.getElementById("simboloEntrada");
    const equivalenciaCelsius = document.getElementById("equivalenciaCelsius");
    const equivalenciaFahrenheit = document.getElementById("equivalenciaFahrenheit");
    const equivalenciaKelvin = document.getElementById("equivalenciaKelvin");

    const simbolos = {
      celsius: "°C",
      fahrenheit: "°F",
      kelvin: "K"
    };

    function convertirACelsius(valor, unidad) {
      if (unidad === "fahrenheit") return (valor - 32) * 5 / 9;
      if (unidad === "kelvin") return valor - 273.15;
      return valor;
    }

    function convertirDesdeCelsius(valor, unidad) {
      if (unidad === "fahrenheit") return valor * 9 / 5 + 32;
      if (unidad === "kelvin") return valor + 273.15;
      return valor;
    }

    function formatearNumero(valor) {
      return Number(valor.toFixed(2)).toLocaleString("es-CO", {
        maximumFractionDigits: 2
      });
    }

    function limpiarEquivalencias() {
      equivalenciaCelsius.textContent = "—";
      equivalenciaFahrenheit.textContent = "—";
      equivalenciaKelvin.textContent = "—";
    }

    function convertirTemperatura() {
      const valor = Number(temperatura.value);
      const origen = unidadOrigen.value;
      const destino = unidadDestino.value;

      simboloEntrada.textContent = simbolos[origen];

      if (temperatura.value.trim() === "" || !Number.isFinite(valor)) {
        resultado.textContent = "—";
        descripcion.textContent = "Ingresa una temperatura válida.";
        mensajeError.style.display = "none";
        limpiarEquivalencias();
        return;
      }

      const valorCelsius = convertirACelsius(valor, origen);

      if (valorCelsius < -273.15 - 1e-9) {
        resultado.textContent = "Valor no válido";
        descripcion.textContent = "Revisa la temperatura ingresada.";
        mensajeError.style.display = "block";
        limpiarEquivalencias();
        return;
      }

      mensajeError.style.display = "none";

      const valorConvertido = convertirDesdeCelsius(valorCelsius, destino);
      const valorFahrenheit = convertirDesdeCelsius(valorCelsius, "fahrenheit");
      const valorKelvin = convertirDesdeCelsius(valorCelsius, "kelvin");

      resultado.textContent = `${formatearNumero(valorConvertido)} ${simbolos[destino]}`;
      descripcion.textContent = `${formatearNumero(valor)} ${simbolos[origen]} equivalen a ${formatearNumero(valorConvertido)} ${simbolos[destino]}`;
      equivalenciaCelsius.textContent = `${formatearNumero(valorCelsius)} °C`;
      equivalenciaFahrenheit.textContent = `${formatearNumero(valorFahrenheit)} °F`;
      equivalenciaKelvin.textContent = `${formatearNumero(valorKelvin)} K`;
    }

    function intercambiarUnidades() {
      const valor = Number(temperatura.value);
      const origen = unidadOrigen.value;
      const destino = unidadDestino.value;

      if (temperatura.value.trim() !== "" && Number.isFinite(valor)) {
        const valorCelsius = convertirACelsius(valor, origen);
        if (valorCelsius >= -273.15) {
          temperatura.value = Number(convertirDesdeCelsius(valorCelsius, destino).toFixed(2));
        }
      }

      unidadOrigen.value = destino;
      unidadDestino.value = origen;
      convertirTemperatura();
    }

    async function copiarResultado() {
      if (["—", "Valor no válido"].includes(resultado.textContent)) return;

      const boton = document.getElementById("copiar");

      try {
        await navigator.clipboard.writeText(resultado.textContent);
        boton.textContent = "Resultado copiado ✓";
      } catch {
        boton.textContent = "No se pudo copiar";
      }

      setTimeout(() => {
        boton.textContent = "Copiar resultado";
      }, 1500);
    }

    function restablecerConversor() {
      temperatura.value = "25";
      unidadOrigen.value = "celsius";
      unidadDestino.value = "fahrenheit";
      convertirTemperatura();
    }

    temperatura.addEventListener("input", convertirTemperatura);
    unidadOrigen.addEventListener("change", convertirTemperatura);
    unidadDestino.addEventListener("change", convertirTemperatura);
    document.getElementById("intercambiar").addEventListener("click", intercambiarUnidades);
    document.getElementById("copiar").addEventListener("click", copiarResultado);
    document.getElementById("restablecer").addEventListener("click", restablecerConversor);

    convertirTemperatura();
  </script>
</body>
</html>
